<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Book By ID</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 50px;
        }

        .container {
            width: 350px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .show-btn {
            background-color: #007bff;
        }

        .show-btn:hover {
            background-color: #0056b3;
        }

        .back-btn {
            display: block;
            box-sizing: border-box;
            text-align: center;
            text-decoration: none;
            background-color: #6c757d;
        }

        .back-btn:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Show Book By ID</h2>

    <form action="showBookUsingId" method="get">

        <label for="bookid">Enter Book ID:</label>
        <input
                type="number"
                id="bookid"
                name="bookId"
                placeholder="Enter Book ID"
                min="1"
                required
        >

        <button type="submit" class="show-btn">
            Show Book
        </button>

        <a href="Index.html"
           class="back-btn"
           style="padding: 12px; margin-top: 10px;">
            Back to Home
        </a>

    </form>
</div>

</body>
</html>
